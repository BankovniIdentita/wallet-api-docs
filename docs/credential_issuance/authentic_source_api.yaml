openapi: 3.1.0
info:
  title: Title
  description: Title
  version: 1.0.0
servers:
  - url: 'https'
paths:
  /.well-known/authentic-source:
    get:
      summary: Get the credential authentic source
      description: Returns defined endpoints for authentic source
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticSourceMetadata'
  /retrieve:
    post:
      summary: Retrieve credential authentic source
      description: Retrieve credential authentic source
      security:
        - BearerAuth: [ ]

      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticSourceMetadata'
  /authorize:
    post:
      summary: Match and authorize user's data from Wallet
      description: >-
        Authorize user by matching theirs data to source data, to retrieve token to be used for obtaining credentials data sets via /retrieve endpoint. 
        Endpoint also may return credential identifiers for multiple different data sets.

      security:
        - BearerAuth: [ ]

      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'
components:
  schemas:
    AuthenticSourceMetadata:
      type: object
      properties:
        authentic_source_url:
          type: string
          description: URL of the authentic source
          example: https://authentic.example.com
        retrieve_endpoint:
          type: string
          description: >-
            Endpoint to retrieve credential from authentic source
          example: https://authentic.example.com/retrieve

    RetrieveResponse:
      type: object
      properties:
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'

    AuthorizeResponse:
      type: object
      properties:
        authorization_token:
          type: string
          description: Token to be used for obtaining credentials data sets via /retrieve endpoint
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
        credential_identifiers:
          type: array
          description: >-
            List of credential identifiers for multiple different data sets.
          items:
            type: string
          example: ['credential_identifier_1', 'credential_identifier_2']
    Attribute:
      type: object
      properties:
        attribute_name:
          type: string
          description: Name of the attribute
        attribute_value:
          type: any
          description: Value of the attribute



